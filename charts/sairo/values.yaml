# Sairo Helm Chart - Default Values

replicaCount: 1

# Time a pod gets to flush an in-flight crawl on SIGTERM before SIGKILL.
terminationGracePeriodSeconds: 30

image:
  repository: stephenjr002/sairo
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: sairo.example.com
  tls: []

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 20Gi          # ~1 GB per 1M indexed objects (incl. search index)
  keep: true          # helm.sh/resource-policy: keep on the PVC (survives uninstall)

# S3 Configuration (required)
s3:
  endpoint: ""         # e.g., https://s3.us-east-1.amazonaws.com
  region: ""
  accessKey: ""
  secretKey: ""
  pathStyle: false       # Enable for MinIO, Ceph, and other path-style S3 providers

# Auth Configuration
auth:
  mode: "local"        # "local" (username/password) or "s3" (authenticate with S3 access key/secret key)
  adminUser: "admin"
  adminPass: ""        # Auto-generated if empty
  jwtSecret: ""        # Auto-generated if empty
  sessionHours: 24
  secureCookie: true

# Anonymous telemetry heartbeat (aggregate counts only; see docs). Set enabled: false to opt out.
telemetry:
  enabled: true

# Crawler Configuration
crawler:
  recrawlInterval: 120

# Rate Limiting (optional)
rateLimit:
  default: "120/minute"   # General API rate limit per IP
  upload: "30/minute"     # Upload endpoint rate limit per IP

# LDAP Configuration (optional)
ldap:
  enabled: false
  server: ""
  baseDn: ""
  userFilter: "(sAMAccountName={username})"
  bindDn: ""
  bindPassword: ""
  adminGroup: ""
  defaultRole: "viewer"

# OAuth / OIDC (optional)
oauth:
  google:
    clientId: ""
    clientSecret: ""
  github:
    clientId: ""
    clientSecret: ""
  defaultRole: "viewer"
  allowedDomains: ""       # Comma-separated: "example.com,corp.com"

# OIDC — generic OpenID Connect SSO (optional).
# Enabled when issuer + clientId are set. Endpoints are auto-discovered from
# <issuer>/.well-known/openid-configuration and the ID token is fully validated.
# Only the username is synced; admins assign roles/bucket permissions.
# Redirect URI to register with your provider: https://<host>/api/auth/oidc/callback
oidc:
  issuer: ""               # e.g. https://login.example.com/realms/main
  clientId: ""
  clientSecret: ""
  providerName: "SSO"      # label on the login button
  usernameClaim: "preferred_username"
  scopes: "openid profile email"
  defaultRole: "viewer"
  allowedDomains: ""       # optional email-domain allowlist
  adminGroup: ""           # optional: members of this group become admins (off = username-only)
  groupsClaim: "groups"    # claim containing the user's groups
  requireVerifiedEmail: false
  rpLogout: false          # also end the IdP session on logout (single logout)

# White-labeling (optional)
branding:
  appName: "Sairo"
  appLogo: ""
  primaryColor: "#3b82f6"
  loginMessage: ""

# Network Policy (optional — restricts pod traffic to S3 and DNS only)
networkPolicy:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}
