{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" .Release.Name)) -}}
{{- $existingData := dict -}}
{{- if $existingSecret }}
{{- $existingData = $existingSecret.data -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
type: Opaque
stringData:
  s3-access-key: {{ .Values.s3.accessKey | quote }}
  s3-secret-key: {{ .Values.s3.secretKey | quote }}
  admin-password: {{ .Values.auth.adminPass | default (index $existingData "admin-password" | default "" | b64dec) | default (randAlphaNum 24) | quote }}
  jwt-secret: {{ .Values.auth.jwtSecret | default (index $existingData "jwt-secret" | default "" | b64dec) | default (randAlphaNum 64) | quote }}
  {{- if and .Values.ldap.enabled .Values.ldap.bindPassword }}
  ldap-bind-password: {{ .Values.ldap.bindPassword | quote }}
  {{- end }}
  {{- if .Values.oauth.google.clientSecret }}
  oauth-google-secret: {{ .Values.oauth.google.clientSecret | quote }}
  {{- end }}
  {{- if .Values.oauth.github.clientSecret }}
  oauth-github-secret: {{ .Values.oauth.github.clientSecret | quote }}
  {{- end }}
  {{- if and .Values.oidc.issuer .Values.oidc.clientSecret }}
  oidc-client-secret: {{ .Values.oidc.clientSecret | quote }}
  {{- end }}
