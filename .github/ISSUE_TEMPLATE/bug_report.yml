name: Bug Report
description: Report a bug or unexpected behavior
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sairo version
      description: Output of the Docker image tag or CLI `sairo version`
      placeholder: "2.0.1"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Docker
        - Docker Compose
        - Helm / Kubernetes
        - CLI
    validations:
      required: true
  - type: input
    id: s3-provider
    attributes:
      label: S3 provider
      placeholder: "AWS S3, MinIO, Cloudflare R2, Wasabi, etc."
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant container or browser console logs.
      render: shell
