version: 2
project_name: sairo

builds:
  - main: ./main.go
    binary: sairo
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

brews:
  - repository:
      owner: ashwathstephen
      name: homebrew-sairo
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/ashwathstephen/sairo
    description: "Fast S3 storage browser CLI — sub-second queries on petabyte-scale buckets"
    install: |
      bin.install "sairo"
    test: |
      system "#{bin}/sairo", "version"

nfpms:
  - package_name: sairo
    vendor: Sairo
    homepage: https://github.com/ashwathstephen/sairo
    maintainer: Ashwath Stephen
    description: "Fast S3 storage browser CLI"
    formats:
      - deb
      - rpm

checksum:
  name_template: "checksums.txt"

release:
  header: |
    ## Install

    **CLI**
    ```bash
    brew install ashwathstephen/sairo/sairo
    ```

    **Docker** (amd64 + arm64)
    ```bash
    docker pull stephenjr002/sairo:{{ .Version }}
    ```

    **Helm**
    ```bash
    helm install sairo oci://registry-1.docker.io/stephenjr002/sairo --version {{ .Version }}
    ```

changelog:
  use: github
  sort: asc
