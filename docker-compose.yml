version: "3.8"
services:
  sairo:
    build: .
    ports:
      - "8000:8000"
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT in .env}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_REGION: ${S3_REGION:-us-east-1}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:?Set ADMIN_PASS in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (use a random 32+ char string)}
      SECURE_COOKIE: ${SECURE_COOKIE:-true}
      RECRAWL_INTERVAL: ${RECRAWL_INTERVAL:-120}
    volumes:
      - sairo-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sairo-data:
